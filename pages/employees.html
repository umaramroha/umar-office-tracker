<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team · UOT</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/components.css">
</head><body>
<div class="topbar"><h1>Team</h1></div>
<div class="container">
  <div class="card stack" id="officeCard">
    <h3>Office location</h3>
    <div class="field"><label class="label">Name</label><input id="oName" class="input"></div>
    <div class="field"><label class="label">Latitude</label><input id="oLat" class="input" type="number" step="any"></div>
    <div class="field"><label class="label">Longitude</label><input id="oLng" class="input" type="number" step="any"></div>
    <div class="field"><label class="label">Radius (m)</label><input id="oRad" class="input" type="number"></div>
    <button id="useMyLoc" class="btn secondary">Use my current location</button>
    <button id="saveLoc"  class="btn">Save office</button>
  </div>

  <div class="card stack" style="margin-top:12px">
    <h3>Members</h3>
    <div id="members" class="muted">Loading…</div>
  </div>
</div>

<nav class="bottomnav">
  <a href="/pages/dashboard.html"><span class="icon">🏠</span>Home</a>
  <a href="/pages/calendar.html"><span class="icon">📅</span>Calendar</a>
  <a href="/pages/reports.html"><span class="icon">📊</span>Reports</a>
  <a href="/pages/employees.html" class="active"><span class="icon">👥</span>Team</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/geolocation.js"></script>
<script src="/js/settings.js"></script>
<script>
(async () => {
  const ctx = await UOT.requireAdmin(); if (!ctx) return;
  const orgId = ctx.membership.organization_id;

  const loc = await UOT.loadOfficeLocation(orgId);
  if (loc) {
    document.getElementById('oName').value = loc.name || '';
    document.getElementById('oLat').value  = loc.latitude;
    document.getElementById('oLng').value  = loc.longitude;
    document.getElementById('oRad').value  = loc.radius_meters;
  }

  document.getElementById('useMyLoc').onclick = async () => {
    try {
      const { latitude, longitude } = await UOT.useMyLocation();
      document.getElementById('oLat').value = latitude.toFixed(6);
      document.getElementById('oLng').value = longitude.toFixed(6);
      UOT.toast('Location filled');
    } catch (e) { UOT.toast(e.message); }
  };

  document.getElementById('saveLoc').onclick = async () => {
    try {
      await UOT.saveOfficeLocation(orgId, {
        name: document.getElementById('oName').value || 'Main Office',
        latitude: parseFloat(document.getElementById('oLat').value),
        longitude: parseFloat(document.getElementById('oLng').value),
        radius_meters: parseInt(document.getElementById('oRad').value || '100', 10)
      });
      UOT.toast('Saved');
    } catch (e) { UOT.toast(e.message); }
  };

  const { data: members } = await sb.from('organization_members')
    .select('user_id, role, profiles(full_name, email)')
    .eq('organization_id', orgId);
  document.getElementById('members').innerHTML = (members || []).map(m => `
    <div class="stat">
      <span class="k">${m.profiles?.full_name || m.profiles?.email || m.user_id}</span>
      <span class="v"><span class="pill ${m.role==='admin'?'info':''}">${m.role}</span></span>
    </div>`).join('') || '<div class="muted">No members.</div>';
})();
</script>
</body></html>
