<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · Umar Office Tracker</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/components.css">
</head><body>
<div class="container" style="padding-top:48px">
  <h1 class="center">Umar Office Tracker</h1>
  <p class="center muted" style="margin-bottom:24px">Sign in to track attendance</p>

  <div class="card stack">
    <div class="field">
      <label class="label">Email</label>
      <input id="email" class="input" type="email" autocomplete="email">
    </div>
    <div class="field">
      <label class="label">Password</label>
      <input id="password" class="input" type="password" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn">Sign in</button>
    <button id="showSignup" class="btn secondary">Create account</button>
  </div>

  <div id="signupBox" class="card stack hidden" style="margin-top:12px">
    <div class="field">
      <label class="label">Full name</label>
      <input id="suName" class="input" type="text">
    </div>
    <div class="field">
      <label class="label">Email</label>
      <input id="suEmail" class="input" type="email">
    </div>
    <div class="field">
      <label class="label">Password</label>
      <input id="suPass" class="input" type="password">
    </div>
    <button id="signupBtn" class="btn good">Sign up</button>
  </div>

  <p class="center muted" style="margin-top:24px;font-size:12px">Created by Umar Imam Khan</p>
</div>

<script src="/js/supabase-lib.js"></script>
<script src="/js/supabase.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script>
document.getElementById('showSignup').onclick = () =>
  document.getElementById('signupBox').classList.toggle('hidden');

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) return UOT.toast('Enter email and password');
  try { await UOT.login(email, password); location.href = '/pages/dashboard'; }
  catch (e) { UOT.toast(e.message); }
};

document.getElementById('signupBtn').onclick = async () => {
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPass').value;
  if (!email || !password) return UOT.toast('Fill all fields');
  try {
    await UOT.signup(email, password, name);
    UOT.toast('Account created. Check email if confirmation is on.');
  } catch (e) { UOT.toast(e.message); }
};
</script>
</body></html>
