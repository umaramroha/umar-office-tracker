<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard · UOT</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/components.css">
</head><body>

<div class="topbar">
  <h1>Hi, <span id="userName">…</span></h1>
  <button class="btn secondary" style="width:auto;padding:6px 12px" id="logoutBtn">Logout</button>
</div>

<div class="container">
  <div class="card stack">
    <div class="row between">
      <h2 id="todayDate">Today</h2>
      <span id="statusPill" class="pill info">—</span>
    </div>
    <div class="stat"><span class="k">Office time</span><span class="v" id="vOffice">0h 00m</span></div>
    <div class="stat"><span class="k">Outside time</span><span class="v" id="vOutside">0h 00m</span></div>
    <div class="stat"><span class="k">Balance today</span><span class="v" id="vBalance">0h 00m</span></div>
    <div class="stat"><span class="k">Location</span><span class="v" id="vGeo">checking…</span></div>
  </div>

  <div class="card stack" style="margin-top:12px">
    <div class="row between">
      <h3>Session</h3>
      <span class="muted" id="sessionInfo">No open session</span>
    </div>
    <button id="inBtn"  class="btn good">Check IN</button>
    <button id="outBtn" class="btn danger">Check OUT</button>
    <button id="manualBtn" class="btn secondary" style="margin-top:8px">Manual Entry / Edit</button>
  </div>

  <div class="card stack" style="margin-top:12px">
    <h3>This month</h3>
    <div id="monthSummary" class="muted">Loading…</div>
  </div>
</div>

<nav class="bottomnav">
  <a href="/pages/dashboard.html" class="active"><span class="icon">🏠</span>Home</a>
  <a href="/pages/calendar.html"><span class="icon">📅</span>Calendar</a>
  <a href="/pages/reports.html"><span class="icon">📊</span>Reports</a>
  <a href="/pages/employees.html" id="navAdmin" class="hidden"><span class="icon">👥</span>Team</a>
</nav>

<div id="manualModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto">
  <div class="card" style="max-width:440px;width:100%;max-height:90vh;overflow-y:auto">
    <div class="row between" style="margin-bottom:12px">
      <h3 style="margin:0">Manual Entry</h3>
      <button id="closeModal" class="btn secondary" style="width:auto;padding:4px 12px">X</button>
    </div>

    <div class="field">
      <label class="label">Date</label>
      <input id="mDay" class="input" type="date">
    </div>
    <div class="field">
      <label class="label">Check In Time</label>
      <input id="mIn" class="input" type="time">
    </div>
    <div class="field">
      <label class="label">Check Out Time</label>
      <input id="mOut" class="input" type="time">
    </div>

    <button id="mSave" class="btn good">Add Session</button>

    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
      <h3 style="margin:0 0 8px">Existing Sessions</h3>
      <div id="sessionList" class="muted">Loading...</div>
    </div>
  </div>
</div>

<script src="/js/supabase-lib.js"></script>
<script src="/js/supabase.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/calculator.js"></script>
<script src="/js/geolocation.js"></script>
<script src="/js/attendance.js"></script>
<script src="/js/reports.js"></script>
<script src="/js/settings.js"></script>
<script>
(async () => {
  const session = await UOT.requireSession(); if (!session) return;
  const userId = session.user.id;
  const profile = await UOT.getProfile(userId);
  const membership = await UOT.getMembership(userId);
  if (!membership) {
    UOT.toast('No organization assigned — ask admin to add you.');
    return;
  }
  const orgId = membership.organization_id;

  document.getElementById('userName').textContent =
    profile?.full_name?.split(' ')[0] || session.user.email;
  if (membership.role === 'admin') document.getElementById('navAdmin').classList.remove('hidden');

  document.getElementById('logoutBtn').onclick = UOT.logout;

  const officeLoc = await UOT.loadOfficeLocation(orgId);

  async function refresh() {
    const day = UOT.todayISO();
    document.getElementById('todayDate').textContent = UOT.fmtDate(day);

    const [sessions, rec, open] = await Promise.all([
      UOT.getDaySessions(userId, day),
      UOT.getDay(userId, day),
      UOT.getOpenSession(userId)
    ]);

    document.getElementById('vOffice').textContent  = UOT.hm(rec?.total_office_minutes || 0);
    document.getElementById('vOutside').textContent = UOT.hm(rec?.outside_minutes || 0);
    const bal = rec?.balance_minutes || 0;
    document.getElementById('vBalance').textContent = UOT.hm(bal);

    const pill = document.getElementById('statusPill');
    pill.textContent = rec?.status || (sessions.length ? 'present' : '—');
    pill.className = 'pill ' + (rec?.status === 'absent' ? 'bad' :
                                rec?.status === 'leave'  ? 'warn' : 'good');

    document.getElementById('sessionInfo').textContent = open
      ? 'Open since ' + UOT.fmtTime(open.check_in) : 'No open session';

    document.getElementById('inBtn').disabled  = !!open;
    document.getElementById('outBtn').disabled = !open;

    const now = new Date();
    const mr = await UOT.monthlyReport(userId, now.getFullYear(), now.getMonth());
    document.getElementById('monthSummary').innerHTML = `
      <div class="stat"><span class="k">Target</span><span class="v">${UOT.hm(mr.target)}</span></div>
      <div class="stat"><span class="k">Worked</span><span class="v">${UOT.hm(mr.totals.office)}</span></div>
      <div class="stat"><span class="k">Outside</span><span class="v">${UOT.hm(mr.totals.outside)}</span></div>
      <div class="stat"><span class="k">Balance</span>
        <span class="v"><span class="pill ${mr.delta>=0?'good':'bad'}">${UOT.hm(mr.delta)}</span></span></div>`;
  }

  (async () => {
    try {
      const pos = await UOT.getPosition();
      if (officeLoc) {
        const { inside, distance } = UOT.insideGeofence(pos, officeLoc);
        document.getElementById('vGeo').textContent =
          (inside ? 'Inside' : 'Outside') + ' office (' + distance + 'm)';
      } else {
        document.getElementById('vGeo').textContent = 'No office set';
      }
    } catch {
      document.getElementById('vGeo').textContent = 'Unavailable';
    }
  })();

  document.getElementById('inBtn').onclick = async () => {
    try {
      let coords = null;
      try {
        const pos = await UOT.getPosition();
        coords = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
        if (officeLoc) {
          const g = UOT.insideGeofence(pos, officeLoc);
          coords.inside = g.inside;
          if (!g.inside && !confirm('You are ' + g.distance + 'm from office. Check in anyway?')) return;
        }
      } catch {}
      await UOT.checkIn(userId, orgId, coords);
      UOT.toast('Checked in');
      refresh();
    } catch (e) { UOT.toast(e.message); }
  };

  document.getElementById('outBtn').onclick = async () => {
    try { await UOT.checkOut(userId, orgId); UOT.toast('Checked out'); refresh(); }
    catch (e) { UOT.toast(e.message); }
  };

  // ========== MANUAL ENTRY LOGIC ==========
  const modal = document.getElementById('manualModal');
  const closeModal = document.getElementById('closeModal');
  const mDay = document.getElementById('mDay');
  const mIn = document.getElementById('mIn');
  const mOut = document.getElementById('mOut');
  const mSave = document.getElementById('mSave');
  const sessionList = document.getElementById('sessionList');

  mDay.value = UOT.todayISO();

  async function loadSessions() {
    const sessions = await UOT.getDaySessions(userId, mDay.value);
    if (!sessions.length) {
      sessionList.innerHTML = '<div class="muted">No sessions.</div>';
      return;
    }
    sessionList.innerHTML = sessions.map(s => `
      <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:13px">${UOT.fmtTime(s.check_in)} to ${s.check_out ? UOT.fmtTime(s.check_out) : 'active'}</span>
        <button class="btn secondary" style="width:auto;padding:4px 8px;font-size:12px" data-del="${s.id}">Del</button>
      </div>`).join('');

    sessionList.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Delete this session?')) return;
        try {
          await UOT.deleteSession(userId, orgId, btn.dataset.del);
          UOT.toast('Deleted');
          loadSessions();
          refresh();
        } catch (e) { UOT.toast(e.message); }
      };
    });
  }

  document.getElementById('manualBtn').onclick = () => {
    modal.classList.remove('hidden');
    mDay.value = UOT.todayISO();
    loadSessions();
  };

  closeModal.onclick = () => modal.classList.add('hidden');

  mDay.onchange = () => loadSessions();

  mSave.onclick = async () => {
    if (!mIn.value || !mOut.value) return UOT.toast('Enter both times');

    const day = mDay.value;
    const inISO = new Date(day + 'T' + mIn.value + ':00').toISOString();
    const outISO = new Date(day + 'T' + mOut.value + ':00').toISOString();

    if (new Date(outISO) <= new Date(inISO)) return UOT.toast('Out time must be after In time');

    try {
      await UOT.addManualSession(userId, orgId, day, inISO, outISO);
      UOT.toast('Session added');
      mIn.value = '';
      mOut.value = '';
      loadSessions();
      refresh();
    } catch (e) { UOT.toast(e.message); }
  };

  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body></html>
