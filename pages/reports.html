<script>
(async () => {
  const session = await UOT.requireSession(); if (!session) return;
  const now = new Date();
  UOT.renderMonthlyReport(session.user.id, now.getFullYear(), now.getMonth(),
    document.getElementById('report'));
})();
</script>
